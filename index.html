<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>续智博</title>
    <style>
        :root {
            --bg: #35e58e;
            --ink: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            overflow: hidden;
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .hero {
            width: min(96vw, 1320px);
            padding: 0.8rem 0.4rem;
            touch-action: none;
        }

        .stage {
            --logo-size: clamp(4.8rem, 20vw, 13.6rem);
            position: relative;
            width: 100%;
            min-height: calc(var(--logo-size) * 1.02);
            isolation: isolate;
            display: grid;
            place-items: center;
        }

        .logo {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            user-select: none;
        }

        .base { z-index: 1; }

        .grid {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
        }

        .tile .txt {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            transform: translate3d(0, 0, 0);
            transition: transform 95ms cubic-bezier(0.22, 1, 0.36, 1), opacity 90ms linear;
            will-change: transform;
        }
    </style>
</head>
<body>
    <section class="hero" id="wrap">
        <div class="stage">
            <div class="logo base">续智博</div>
            <div class="grid" id="grid" aria-hidden="true"></div>
        </div>
    </section>

    <script>
        (function () {
            var wrap = document.getElementById('wrap');
            var grid = document.getElementById('grid');
            if (!wrap || !grid) return;

            var cols = 24;
            var rows = 9;
            var text = '续智博';
            var tiles = [];

            var tx = 0.5, ty = 0.5;
            var sx = 0.5, sy = 0.5;
            var px = 0.5, py = 0.5;
            var vx = 0, vy = 0;
            var raf = 0;
            var active = false;

            function buildGrid() {
                grid.innerHTML = '';
                tiles = [];
                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        var tile = document.createElement('div');
                        tile.className = 'tile';

                        var l = (c / cols) * 100;
                        var t = (r / rows) * 100;
                        var rr = 100 - ((c + 1) / cols) * 100;
                        var b = 100 - ((r + 1) / rows) * 100;
                        tile.style.clipPath = 'inset(' + t + '% ' + rr + '% ' + b + '% ' + l + '%)';

                        var txt = document.createElement('div');
                        txt.className = 'txt';
                        txt.textContent = text;
                        tile.appendChild(txt);
                        grid.appendChild(tile);

                        tiles.push({
                            el: tile,
                            txt: txt,
                            cx: (c + 0.5) / cols,
                            cy: (r + 0.5) / rows
                        });
                    }
                }
            }

            function distort(nx, ny) {
                // 鼠标附近最强，周围对称衰减（胶水扩散感）
                var radius = 0.34;

                // 方向由鼠标移动决定（官网感）
                vx = vx * 0.2 + (nx - px) * 0.8;
                vy = vy * 0.2 + (ny - py) * 0.8;
                px = nx;
                py = ny;

                var speed = Math.hypot(vx, vy);
                var dragAmp = Math.min(220, 20 + speed * 2200);
                var pullAmp = 95;
                var now = performance.now();

                for (var i = 0; i < tiles.length; i++) {
                    var p = tiles[i];
                    var dx = nx - p.cx;
                    var dy = ny - p.cy;
                    var d = Math.hypot(dx, dy) + 1e-6;

                    var k = Math.max(0, 1 - d / radius);
                    k = k * k * (3 - 2 * k); // smoothstep

                    // toward-pointer pull + direction drag + viscous ripple
                    var ux = dx / d;
                    var uy = dy / d;
                    var wave = Math.sin(d * 38 - now * 0.02) * (10 + speed * 320) * k;

                    var ox = dx * pullAmp * k + vx * dragAmp * k + ux * wave;
                    var oy = dy * (pullAmp * 0.62) * k + vy * (dragAmp * 0.55) * k + uy * wave * 0.65;

                    p.txt.style.transform = 'translate3d(' + ox.toFixed(2) + 'px,' + oy.toFixed(2) + 'px,0)';
                    p.el.style.opacity = (k > 0.006 ? 1 : 0).toString();
                }
            }

            function loop() {
                if (!active) return;
                sx += (tx - sx) * 0.35;
                sy += (ty - sy) * 0.35;
                distort(sx, sy);
                raf = requestAnimationFrame(loop);
            }

            function isNearRect(clientX, clientY, rect, pad) {
                return (
                    clientX >= rect.left - pad &&
                    clientX <= rect.right + pad &&
                    clientY >= rect.top - pad &&
                    clientY <= rect.bottom + pad
                );
            }

            function updateFromPointer(clientX, clientY) {
                var rect = wrap.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                if (!isNearRect(clientX, clientY, rect, 120)) {
                    reset();
                    return;
                }
                tx = (clientX - rect.left) / rect.width;
                ty = (clientY - rect.top) / rect.height;
                if (!active) {
                    active = true;
                    sx = tx; sy = ty; px = tx; py = ty;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(loop);
                }
            }

            function reset() {
                active = false;
                cancelAnimationFrame(raf);
                for (var i = 0; i < tiles.length; i++) {
                    tiles[i].txt.style.transform = 'translate3d(0,0,0)';
                    tiles[i].el.style.opacity = '0';
                }
                vx = 0; vy = 0;
            }

            buildGrid();
            window.addEventListener('mousemove', function (e) { updateFromPointer(e.clientX, e.clientY); });
            window.addEventListener('touchmove', function (e) {
                if (!e.touches[0]) return;
                updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            wrap.addEventListener('touchend', reset);
            wrap.addEventListener('touchcancel', reset);
            window.addEventListener('resize', buildGrid);
        })();
    </script>
</body>
</html>
