<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>续智博</title>
    <style>
        :root {
            --bg: #35e58e;
            --ink: #050505;
            --p1: #35e58e;
            --p2: #35e58e;
            --p3: #35e58e;
            --p4: #35e58e;
            --t1: #050505;
            --t2: #050505;
            --t3: #050505;
            --t4: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: var(--bg);
            overflow: hidden;
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            position: relative;
            transition: background-color 280ms ease;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-panels {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
        }

        .bg-panels span {
            transition:
                transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1),
                background-color 300ms ease;
        }

        .bg-panels span:nth-child(1) { background: var(--p1); }
        .bg-panels span:nth-child(2) { background: var(--p2); }
        .bg-panels span:nth-child(3) { background: var(--p3); }
        .bg-panels span:nth-child(4) { background: var(--p4); }

        body.split-on .bg-panels {
            opacity: 0.72;
        }

        body.panel-switch .bg-panels span:nth-child(1) { transform: translate3d(-1.6vw, -1.1vh, 0); }
        body.panel-switch .bg-panels span:nth-child(2) { transform: translate3d(1.4vw, -0.9vh, 0); }
        body.panel-switch .bg-panels span:nth-child(3) { transform: translate3d(-1.2vw, 1.1vh, 0); }
        body.panel-switch .bg-panels span:nth-child(4) { transform: translate3d(1.5vw, 1.2vh, 0); }

        .hero {
            width: min(96vw, 1320px);
            padding: 0.8rem 0.4rem;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        .stage {
            --logo-size: clamp(4.8rem, 20vw, 13.6rem);
            position: relative;
            width: 100%;
            min-height: calc(var(--logo-size) * 1.02);
            isolation: isolate;
            display: grid;
            place-items: center;
        }

        .logo {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }

        .base {
            z-index: 1;
            transition: opacity 180ms linear, color 260ms ease;
        }

        .quad {
            z-index: 1;
            opacity: 0;
            transition: opacity 180ms linear, transform 200ms ease, color 280ms ease;
            text-shadow: 0 0 1px rgba(5, 8, 7, 0.35);
        }

        .q1 {
            color: var(--t1);
            -webkit-clip-path: inset(0 50% 50% 0);
            clip-path: inset(0 50% 50% 0);
        }
        .q2 {
            color: var(--t2);
            -webkit-clip-path: inset(0 0 50% 50%);
            clip-path: inset(0 0 50% 50%);
        }
        .q3 {
            color: var(--t3);
            -webkit-clip-path: inset(50% 50% 0 0);
            clip-path: inset(50% 50% 0 0);
        }
        .q4 {
            color: var(--t4);
            -webkit-clip-path: inset(50% 0 0 50%);
            clip-path: inset(50% 0 0 50%);
        }

        body.split-on .base { opacity: 0; }
        body.split-on .quad { opacity: 1; }
        body.split-on.panel-switch .q1 { transform: translate3d(-4px, -2px, 0); }
        body.split-on.panel-switch .q2 { transform: translate3d(3px, -3px, 0); }
        body.split-on.panel-switch .q3 { transform: translate3d(-3px, 2px, 0); }
        body.split-on.panel-switch .q4 { transform: translate3d(4px, 3px, 0); }

        .grid {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
        }

        .tile .txt {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            transform: translate3d(0, 0, 0);
            transition:
                transform 95ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 90ms linear,
                color 260ms ease;
            will-change: transform;
        }

        @supports not ((clip-path: inset(0 0 0 0)) or (-webkit-clip-path: inset(0 0 0 0))) {
            .quad { display: none !important; }
            body.split-on .base { opacity: 1; }
        }

        @media (pointer: coarse) {
            .hero {
                width: 100vw;
                padding: max(0.5rem, env(safe-area-inset-top)) max(0.4rem, env(safe-area-inset-right)) max(0.5rem, env(safe-area-inset-bottom)) max(0.4rem, env(safe-area-inset-left));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body, .bg-panels span, .base, .quad, .tile .txt {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-panels" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
    </div>
    <section class="hero" id="wrap">
        <div class="stage">
            <div class="logo base">续智博</div>
            <div class="logo quad q1">续智博</div>
            <div class="logo quad q2">续智博</div>
            <div class="logo quad q3">续智博</div>
            <div class="logo quad q4">续智博</div>
            <div class="grid" id="grid" aria-hidden="true"></div>
        </div>
    </section>

    <script>
        (function () {
            var wrap = document.getElementById('wrap');
            var grid = document.getElementById('grid');
            if (!wrap || !grid) return;
            var root = document.documentElement;
            var modeIndex = 0;
            var modes = [
                { split: false, ink: '#050505', p1: '#35e58e', p2: '#35e58e', p3: '#35e58e', p4: '#35e58e', shift: 0, textMap: [1, 1, 1, 1] },
                { split: true,  ink: '#08140d', p1: '#53c98a', p2: '#c85f5f', p3: '#4f88d9', p4: '#ccb454', shift: 2.8, textMap: [2, 3, 4, 1] },
                { split: true,  ink: '#0f1a10', p1: '#49b97f', p2: '#b95a5a', p3: '#4a78bf', p4: '#bca14b', shift: 3.5, textMap: [3, 4, 1, 2] },
                { split: true,  ink: '#1a1a1a', p1: '#63d7a2', p2: '#d77a7a', p3: '#6e9dd9', p4: '#d8c06d', shift: 4.2, textMap: [4, 1, 2, 3] },
                { split: true,  ink: '#151515', p1: '#59c790', p2: '#c97f60', p3: '#5d86cc', p4: '#cab25f', shift: 4.8, textMap: [2, 4, 1, 3] }
            ];

            var cols = 24;
            var rows = 9;
            var text = '续智博';
            var tiles = [];

            var tx = 0.5, ty = 0.5;
            var sx = 0.5, sy = 0.5;
            var px = 0.5, py = 0.5;
            var vx = 0, vy = 0;
            var raf = 0;
            var active = false;
            var currentShift = 0;
            var isTouchDevice = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
            var supportsClipPath = !!(window.CSS && CSS.supports && (CSS.supports('clip-path', 'inset(0 0 0 0)') || CSS.supports('-webkit-clip-path', 'inset(0 0 0 0)')));
            var touchActive = false;

            function buildGrid() {
                grid.innerHTML = '';
                tiles = [];
                cols = isTouchDevice ? 18 : 24;
                rows = isTouchDevice ? 7 : 9;
                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        var tile = document.createElement('div');
                        tile.className = 'tile';

                        var l = (c / cols) * 100;
                        var t = (r / rows) * 100;
                        var rr = 100 - ((c + 1) / cols) * 100;
                        var b = 100 - ((r + 1) / rows) * 100;
                        if (supportsClipPath) {
                            var insetValue = 'inset(' + t + '% ' + rr + '% ' + b + '% ' + l + '%)';
                            tile.style.clipPath = insetValue;
                            tile.style.webkitClipPath = insetValue;
                        } else {
                            tile.style.left = l + '%';
                            tile.style.top = t + '%';
                            tile.style.width = (100 / cols) + '%';
                            tile.style.height = (100 / rows) + '%';
                        }

                        var txt = document.createElement('div');
                        txt.className = 'txt';
                        txt.textContent = text;
                        tile.appendChild(txt);
                        grid.appendChild(tile);

                        tiles.push({
                            el: tile,
                            txt: txt,
                            cx: (c + 0.5) / cols,
                            cy: (r + 0.5) / rows,
                            qx: c < cols / 2 ? 0 : 1,
                            qy: r < rows / 2 ? 0 : 1
                        });
                    }
                }
                applyMode();
            }

            function distort(nx, ny, introMode) {
                // 鼠标附近最强，周围对称衰减（胶水扩散感）
                var radius = introMode ? 0.24 : 0.34;

                // 方向由鼠标移动决定（官网感）
                vx = vx * 0.2 + (nx - px) * 0.8;
                vy = vy * 0.2 + (ny - py) * 0.8;
                px = nx;
                py = ny;

                var speed = Math.hypot(vx, vy);
                var dragAmp = introMode ? Math.min(42, 6 + speed * 700) : Math.min(220, 20 + speed * 2200);
                var pullAmp = introMode ? 26 : 95;
                var now = performance.now();

                for (var i = 0; i < tiles.length; i++) {
                    var p = tiles[i];
                    var dx = nx - p.cx;
                    var dy = ny - p.cy;
                    var d = Math.hypot(dx, dy) + 1e-6;

                    var k = Math.max(0, 1 - d / radius);
                    k = k * k * (3 - 2 * k); // smoothstep

                    // toward-pointer pull + direction drag + viscous ripple
                    var ux = dx / d;
                    var uy = dy / d;
                    var wave = introMode ? 0 : Math.sin(d * 38 - now * 0.02) * (10 + speed * 320) * k;

                    var ox = dx * pullAmp * k + vx * dragAmp * k + ux * wave;
                    var oy = dy * (pullAmp * 0.62) * k + vy * (dragAmp * 0.55) * k + uy * wave * 0.65;
                    if (document.body.classList.contains('split-on')) {
                        var staggerX = (p.qx ? 1 : -1) * currentShift;
                        var staggerY = (p.qy ? 1 : -1) * currentShift * 0.75;
                        ox += staggerX;
                        oy += staggerY;
                    }

                    p.txt.style.transform = 'translate3d(' + ox.toFixed(2) + 'px,' + oy.toFixed(2) + 'px,0)';
                    p.el.style.opacity = (k > 0.006 ? 1 : 0).toString();
                }
            }

            function loop() {
                if (!active) return;
                sx += (tx - sx) * 0.35;
                sy += (ty - sy) * 0.35;
                distort(sx, sy, false);
                raf = requestAnimationFrame(loop);
            }

            function isNearRect(clientX, clientY, rect, pad) {
                return (
                    clientX >= rect.left - pad &&
                    clientX <= rect.right + pad &&
                    clientY >= rect.top - pad &&
                    clientY <= rect.bottom + pad
                );
            }

            function updateFromPointer(clientX, clientY) {
                var rect = wrap.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                if (!isNearRect(clientX, clientY, rect, 120)) {
                    reset();
                    return;
                }
                tx = (clientX - rect.left) / rect.width;
                ty = (clientY - rect.top) / rect.height;
                if (!active) {
                    active = true;
                    sx = tx; sy = ty; px = tx; py = ty;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(loop);
                }
            }

            function reset() {
                active = false;
                cancelAnimationFrame(raf);
                for (var i = 0; i < tiles.length; i++) {
                    tiles[i].txt.style.transform = 'translate3d(0,0,0)';
                    tiles[i].el.style.opacity = '0';
                }
                vx = 0; vy = 0;
            }

            function applyMode() {
                var m = modes[modeIndex];
                root.style.setProperty('--ink', m.ink);
                root.style.setProperty('--p1', m.p1);
                root.style.setProperty('--p2', m.p2);
                root.style.setProperty('--p3', m.p3);
                root.style.setProperty('--p4', m.p4);
                var t1 = m['p' + m.textMap[0]];
                var t2 = m['p' + m.textMap[1]];
                var t3 = m['p' + m.textMap[2]];
                var t4 = m['p' + m.textMap[3]];
                root.style.setProperty('--t1', t1);
                root.style.setProperty('--t2', t2);
                root.style.setProperty('--t3', t3);
                root.style.setProperty('--t4', t4);
                currentShift = m.shift || 0;
                document.body.classList.toggle('split-on', m.split);
                for (var i = 0; i < tiles.length; i++) {
                    var p = tiles[i];
                    if (!m.split) {
                        p.txt.style.color = m.ink;
                        continue;
                    }
                    var q = p.qy * 2 + p.qx + 1;
                    p.txt.style.color = m['p' + m.textMap[q - 1]];
                }
            }

            function cycleMode() {
                modeIndex = (modeIndex + 1) % modes.length;
                document.body.classList.add('panel-switch');
                applyMode();
                setTimeout(function () {
                    document.body.classList.remove('panel-switch');
                }, 190);
            }

            buildGrid();
            applyMode();
            if (window.PointerEvent) {
                document.body.addEventListener('pointerup', cycleMode);
            } else {
                document.body.addEventListener('click', cycleMode);
            }

            if (!isTouchDevice) {
                window.addEventListener('mousemove', function (e) { updateFromPointer(e.clientX, e.clientY); });
            } else {
                wrap.addEventListener('touchstart', function (e) {
                    if (!e.touches[0]) return;
                    touchActive = true;
                    updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                window.addEventListener('touchmove', function (e) {
                    if (!touchActive || !e.touches[0]) return;
                    updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                window.addEventListener('touchend', function () {
                    touchActive = false;
                    reset();
                });
                window.addEventListener('touchcancel', function () {
                    touchActive = false;
                    reset();
                });
            }

            window.addEventListener('resize', buildGrid);

        })();
    </script>
</body>
</html>
