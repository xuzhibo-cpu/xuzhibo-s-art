<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>续智博</title>
    <style>
        :root {
            --bg: #35e58e;
            --ink: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            position: relative;
            display: grid;
            place-items: center;
            background: var(--bg);
            transition: background-color 360ms cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .splash-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .hero {
            width: min(96vw, 1320px);
            padding: 0.8rem 0.4rem;
            touch-action: none;
            position: relative;
            z-index: 1;
        }

        .stage {
            --logo-size: clamp(4.8rem, 20vw, 13.6rem);
            position: relative;
            width: 100%;
            min-height: calc(var(--logo-size) * 1.02);
            isolation: isolate;
            display: grid;
            place-items: center;
        }

        .logo {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            user-select: none;
        }

        .base { z-index: 1; }

        .grid {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
        }

        .tile .txt {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: var(--logo-size);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 0.92;
            white-space: nowrap;
            transform: translate3d(0, 0, 0);
            transition: transform 95ms cubic-bezier(0.22, 1, 0.36, 1), opacity 90ms linear;
            will-change: transform;
        }

        .ink-splash {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--size, 180px);
            height: var(--size, 180px);
            background:
                radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.22) 0 15%, transparent 28%),
                radial-gradient(circle at 52% 56%, var(--color-soft, rgba(255, 111, 174, 0.7)) 0 58%, rgba(0, 0, 0, 0) 100%);
            border-radius: 41% 59% 62% 38% / 50% 43% 57% 50%;
            transform: translate(-50%, -50%) scale(0.08) rotate(var(--rot, 0deg));
            filter: blur(var(--blur, 2px)) saturate(1.03);
            opacity: var(--alpha, 0.88);
            will-change: transform, border-radius, opacity;
            animation: ink-burst var(--dur, 980ms) cubic-bezier(0.21, 0.81, 0.24, 1) forwards;
        }

        @keyframes ink-burst {
            0% {
                border-radius: 41% 59% 62% 38% / 50% 43% 57% 50%;
                opacity: var(--alpha, 0.88);
            }
            58% {
                border-radius: 56% 44% 39% 61% / 38% 58% 42% 62%;
                opacity: calc(var(--alpha, 0.88) * 0.92);
            }
            100% {
                transform: translate(-50%, -50%) scale(var(--scale, 18)) rotate(calc(var(--rot, 0deg) + 34deg));
                border-radius: 50%;
                opacity: 0.16;
            }
        }
    </style>
</head>
<body>
    <section class="hero" id="wrap">
        <div class="stage">
            <div class="logo base">续智博</div>
            <div class="grid" id="grid" aria-hidden="true"></div>
        </div>
    </section>

    <script>
        (function () {
            var wrap = document.getElementById('wrap');
            var grid = document.getElementById('grid');
            if (!wrap || !grid) return;

            var cols = 24;
            var rows = 9;
            var text = '续智博';
            var tiles = [];
            // Keep the same order, but normalize luminance/saturation for smoother transitions.
            var colorSequence = ['#f58db8', '#5f88f2', '#4fd89a', '#e6be58', '#f292bf', '#9a69e3', '#6790ee', '#dfb850'];
            var colorCursor = -1;
            var lastSwitchAt = 0;
            var lastSwitchX = window.innerWidth * 0.5;
            var lastSwitchY = window.innerHeight * 0.5;

            var splashLayer = document.createElement('div');
            splashLayer.className = 'splash-layer';
            document.body.appendChild(splashLayer);

            var tx = 0.5, ty = 0.5;
            var sx = 0.5, sy = 0.5;
            var px = 0.5, py = 0.5;
            var vx = 0, vy = 0;
            var raf = 0;
            var active = false;
            var isTouchDevice = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
            var touchActive = false;

            function buildGrid() {
                grid.innerHTML = '';
                tiles = [];
                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        var tile = document.createElement('div');
                        tile.className = 'tile';

                        var l = (c / cols) * 100;
                        var t = (r / rows) * 100;
                        var rr = 100 - ((c + 1) / cols) * 100;
                        var b = 100 - ((r + 1) / rows) * 100;
                        tile.style.clipPath = 'inset(' + t + '% ' + rr + '% ' + b + '% ' + l + '%)';

                        var txt = document.createElement('div');
                        txt.className = 'txt';
                        txt.textContent = text;
                        tile.appendChild(txt);
                        grid.appendChild(tile);

                        tiles.push({
                            el: tile,
                            txt: txt,
                            cx: (c + 0.5) / cols,
                            cy: (r + 0.5) / rows
                        });
                    }
                }
            }

            function distort(nx, ny, introMode) {
                // 鼠标附近最强，周围对称衰减（胶水扩散感）
                var radius = introMode ? 0.24 : 0.34;

                // 方向由鼠标移动决定（官网感）
                vx = vx * 0.2 + (nx - px) * 0.8;
                vy = vy * 0.2 + (ny - py) * 0.8;
                px = nx;
                py = ny;

                var speed = Math.hypot(vx, vy);
                var dragAmp = introMode ? Math.min(42, 6 + speed * 700) : Math.min(220, 20 + speed * 2200);
                var pullAmp = introMode ? 26 : 95;
                var now = performance.now();

                for (var i = 0; i < tiles.length; i++) {
                    var p = tiles[i];
                    var dx = nx - p.cx;
                    var dy = ny - p.cy;
                    var d = Math.hypot(dx, dy) + 1e-6;

                    var k = Math.max(0, 1 - d / radius);
                    k = k * k * (3 - 2 * k); // smoothstep

                    // toward-pointer pull + direction drag + viscous ripple
                    var ux = dx / d;
                    var uy = dy / d;
                    var wave = introMode ? 0 : Math.sin(d * 38 - now * 0.02) * (10 + speed * 320) * k;

                    var ox = dx * pullAmp * k + vx * dragAmp * k + ux * wave;
                    var oy = dy * (pullAmp * 0.62) * k + vy * (dragAmp * 0.55) * k + uy * wave * 0.65;

                    p.txt.style.transform = 'translate3d(' + ox.toFixed(2) + 'px,' + oy.toFixed(2) + 'px,0)';
                    p.el.style.opacity = (k > 0.006 ? 1 : 0).toString();
                }
            }

            function loop() {
                if (!active) return;
                sx += (tx - sx) * 0.35;
                sy += (ty - sy) * 0.35;
                distort(sx, sy, false);
                raf = requestAnimationFrame(loop);
            }

            function isNearRect(clientX, clientY, rect, pad) {
                return (
                    clientX >= rect.left - pad &&
                    clientX <= rect.right + pad &&
                    clientY >= rect.top - pad &&
                    clientY <= rect.bottom + pad
                );
            }

            function updateFromPointer(clientX, clientY) {
                var rect = wrap.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                lastSwitchX = clientX;
                lastSwitchY = clientY;
                if (!isNearRect(clientX, clientY, rect, 120)) {
                    reset();
                    return;
                }
                tx = (clientX - rect.left) / rect.width;
                ty = (clientY - rect.top) / rect.height;
                if (!active) {
                    active = true;
                    sx = tx; sy = ty; px = tx; py = ty;
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(loop);
                }
            }

            function reset() {
                active = false;
                cancelAnimationFrame(raf);
                for (var i = 0; i < tiles.length; i++) {
                    tiles[i].txt.style.transform = 'translate3d(0,0,0)';
                    tiles[i].el.style.opacity = '0';
                }
                vx = 0; vy = 0;
            }

            function createInkSplash(clientX, clientY, color) {
                var size = Math.max(180, Math.min(window.innerWidth, window.innerHeight) * 0.24);
                var far = Math.max(
                    Math.hypot(clientX, clientY),
                    Math.hypot(window.innerWidth - clientX, clientY),
                    Math.hypot(clientX, window.innerHeight - clientY),
                    Math.hypot(window.innerWidth - clientX, window.innerHeight - clientY)
                );
                var scale = (far * 2) / size;

                function toRgba(hex, alpha) {
                    var raw = hex.replace('#', '').trim();
                    if (raw.length === 3) {
                        raw = raw[0] + raw[0] + raw[1] + raw[1] + raw[2] + raw[2];
                    }
                    var r = parseInt(raw.slice(0, 2), 16);
                    var g = parseInt(raw.slice(2, 4), 16);
                    var b = parseInt(raw.slice(4, 6), 16);
                    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
                }

                function addSplash(extraScale, duration, alpha, blur, jitter) {
                    var splash = document.createElement('div');
                    splash.className = 'ink-splash';
                    splash.style.left = (clientX + (Math.random() * 2 - 1) * jitter).toFixed(1) + 'px';
                    splash.style.top = (clientY + (Math.random() * 2 - 1) * jitter).toFixed(1) + 'px';
                    splash.style.setProperty('--size', size.toFixed(1) + 'px');
                    splash.style.setProperty('--scale', (Math.max(8, scale) * extraScale).toFixed(2));
                    splash.style.setProperty('--dur', duration + 'ms');
                    splash.style.setProperty('--alpha', alpha.toFixed(2));
                    splash.style.setProperty('--blur', blur.toFixed(2) + 'px');
                    splash.style.setProperty('--color-soft', toRgba(color, 0.74));
                    splash.style.setProperty('--rot', (Math.random() * 70 - 35).toFixed(2) + 'deg');
                    splashLayer.appendChild(splash);

                    splash.addEventListener('animationend', function () {
                        splash.remove();
                    });
                }

                // 双层扩散，边缘更软，整体更像水墨晕染。
                addSplash(0.9, 920, 0.84, 1.2, 8);
                addSplash(1.16, 1260, 0.56, 3.3, 22);
            }

            function switchBackground(clientX, clientY) {
                var now = performance.now();
                if (now - lastSwitchAt < 220) return;
                lastSwitchAt = now;
                lastSwitchX = clientX;
                lastSwitchY = clientY;

                colorCursor = (colorCursor + 1) % colorSequence.length;
                var nextColor = colorSequence[colorCursor];

                createInkSplash(clientX, clientY, nextColor);
                window.setTimeout(function () {
                    document.documentElement.style.setProperty('--bg', nextColor);
                }, 240);
            }

            function isTypingTarget(target) {
                if (!target) return false;
                var tag = target.tagName;
                return (
                    target.isContentEditable ||
                    tag === 'INPUT' ||
                    tag === 'TEXTAREA' ||
                    tag === 'SELECT'
                );
            }

            buildGrid();

            if (window.PointerEvent) {
                window.addEventListener('pointerdown', function (e) {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    lastSwitchX = e.clientX;
                    lastSwitchY = e.clientY;
                    switchBackground(e.clientX, e.clientY);
                });
            } else {
                window.addEventListener('mousedown', function (e) {
                    if (e.button !== 0) return;
                    lastSwitchX = e.clientX;
                    lastSwitchY = e.clientY;
                    switchBackground(e.clientX, e.clientY);
                });
                window.addEventListener('touchstart', function (e) {
                    if (!e.touches[0]) return;
                    lastSwitchX = e.touches[0].clientX;
                    lastSwitchY = e.touches[0].clientY;
                    switchBackground(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });
            }

            window.addEventListener('keydown', function (e) {
                if (e.repeat) return;
                if (isTypingTarget(e.target)) return;
                switchBackground(lastSwitchX, lastSwitchY);
            });

            if (!isTouchDevice) {
                window.addEventListener('mousemove', function (e) { updateFromPointer(e.clientX, e.clientY); });
            } else {
                wrap.addEventListener('touchstart', function (e) {
                    if (!e.touches[0]) return;
                    touchActive = true;
                    updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                window.addEventListener('touchmove', function (e) {
                    if (!touchActive || !e.touches[0]) return;
                    updateFromPointer(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                window.addEventListener('touchend', function () {
                    touchActive = false;
                    reset();
                });
                window.addEventListener('touchcancel', function () {
                    touchActive = false;
                    reset();
                });
            }

            window.addEventListener('resize', buildGrid);

        })();
    </script>
</body>
</html>
